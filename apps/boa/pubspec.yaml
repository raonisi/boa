name: boa
description: BOA 지점관리 CRM — Android 전용 Flutter 앱 (내부 배포).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  flutter_secure_storage: ^10.2.0
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  dio: ^5.9.2
  google_sign_in: 6.3.0
  intl: ^0.19.0
  url_launcher: ^6.3.1
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
